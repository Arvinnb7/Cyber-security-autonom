# Production-shaped stack: Postgres + API (multi-worker) + a dedicated scheduler
# worker + frontend. For a quick local demo you can still run the services with
# their defaults (data mode = demo).
services:
  postgres:
    image: postgres:16-alpine
    # A monitoring platform that stays down after a crash is worse than none —
    # every service restarts unless an operator deliberately stopped it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: sentinel
    volumes:
      - sentinel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2g}

  backend:
    build: ./backend
    restart: unless-stopped
    # Bounded so a runaway request is contained to this container (and the
    # restart policy brings it straight back) instead of starving the host.
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_MODE: ${DATA_MODE:-demo}
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-dev}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/sentinel
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:-change-me-in-production-please}
      SENTINEL_ENCRYPTION_KEY: ${SENTINEL_ENCRYPTION_KEY:-}
      SENTINEL_ANTHROPIC_API_KEY: ${SENTINEL_ANTHROPIC_API_KEY:-}
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-http://localhost:3000}
      SENTINEL_ATTACK_MODELS_DIR: /attack_models
      # API workers do NOT run the scheduler — the worker service does.
      SENTINEL_RUN_SCHEDULER: "false"
    volumes:
      - ./data/attack_models:/attack_models:ro
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1g}
    # The worker owns ingestion and the watchdog. If its scheduler dies the
    # platform goes blind, so its liveness is checked explicitly.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATA_MODE: ${DATA_MODE:-demo}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/sentinel
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:-change-me-in-production-please}
      SENTINEL_ENCRYPTION_KEY: ${SENTINEL_ENCRYPTION_KEY:-}
      SENTINEL_ANTHROPIC_API_KEY: ${SENTINEL_ANTHROPIC_API_KEY:-}
      SENTINEL_ATTACK_MODELS_DIR: /attack_models
      SENTINEL_RUN_SCHEDULER: "true"
    volumes:
      - ./data/attack_models:/attack_models:ro
    command: ["python", "-m", "app.worker"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  sentinel-pg:
